trigger: none

resources:
  pipelines:
  - pipeline: CodeFirstCI # Any name you can give
    source: CodeFirstEF-CI # Name of pipeline, it will be show when you create pipeline, you can rename as well
    trigger: 
      branches: 
        include:
          - main
          - stage
          - develop

pool: 
  vmImage: 'windows-latest'

stages:
  - stage: DEV
    displayName: 'Deploy to DEV'
    condition: eq(
        variables['resources.pipeline.CodeFirstCI.sourceBranch'],
        'refs/heads/develop'
      )

    jobs:
      - deployment: DeployDEV
        displayName: 'Deploy to DEV'
        environment: DEV

        strategy: 
          runOnce:
            deploy:
              steps:
                - download: CodeFirstCI # pipeline resource name from above section
                  artifact: CodeFirstEF # Artifact name from CI file

                - script: |
                    echo 'Deploying to DEV...'
                  displayName: 'Deploy Application'

#--------------------------------------------------------
  - stage: QA
    displayName: 'Deploy to QA'
    dependsOn: DEV
    condition: eq(
        variables['resources.pipeline.CodeFirstCI.sourceBranch'],
        'refs/heads/develop'
      )

    jobs:
      - deployment: DeployQA
        displayName: 'Deploy to QA'
        environment: QA

        strategy: 
          runOnce:
            deploy:
              steps:
                - download: CodeFirstCI
                  artifact: CodeFirstEF # Artifact name from CI file

                - script: echo 'Deploying to QA'
                  displayName: 'Deploy Application'

#--------------------------------------------------------
  - stage: UAT
    displayName: 'Deploy to UAT'
    condition: startsWith(
          variables['resources.pipeline.CodeFirstCI.sourceBranch'], 
          'refs/heads/release-'
      )

    jobs:
      - deployment: DeployUAT
        displayName: 'Deploy to UAT'
        environment: UAT

        strategy:
          runOnce:
            deploy:
              steps:
                - download: CodeFirstCI
                  artifact: CodeFirstEF

                - script: echo 'Deploying to UAT'
                  displayName: 'Deploy Application'

#--------------------------------------------------------
  - stage: PROD
    displayName: 'Deploy to PROD'
    dependsOn: UAT
    condition: and(
        succeeded('UAT'),
        startsWith(
          variables['resources.pipeline.CodeFirstCI.sourceBranch'], 
          'refs/heads/release-'
        )
      )

    jobs:
      - deployment: DeployPROD
        displayName: 'Deploy to PROD'
        environment: PROD

        strategy:
          runOnce:
            deploy:
              steps:
                - download: CodeFirstCI
                  artifact: CodeFirstEF

                - script: echo 'Deploying to PROD'
                  displayName: 'Deploy Application'

