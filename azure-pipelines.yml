name: AzurePipeline$(date:yyyyMMdd)_$(rev:.r)

trigger: none

pool:
  vmImage: 'windows-latest'

steps:
  - powershell: |
      $outputDir = "$(Build.ArtifactStagingDirectory)"

      New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

      $filePath = Join-Path $outputDir "build-info.txt"

      "Application: SampleApplication" | Set-Content $filePath
      "Build ID: $(Build.BuildId)" | Add-Content $filePath
      "Source Branch: $(Build.SourceBranch)" | Add-Content $filePath

      Write-Host "Build information file created"
    displayName: "Step 1: Create build output"

  - task: PublishBuildArtifacts@1
    displayName: "Step 2: Publish artifacts"
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifact: 'drop'
      publishLocation: pipeline
