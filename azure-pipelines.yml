name: AzurePipeline$(date:yyyyMMdd)$(rev:.r)

trigger: none

pool:
  vmImage: 'windows-latest'
  
variables: 
  appName: 'Code First EF API'
  environmentName: 'Development'
  buildConfiguration: 'Release'

steps:
  - script: echo "Hello from Azure DevOps pipeline"
    displayName: "Step 1: Hello pipeline"

  - script: echo "Application name is - $(appName)"
    displayName: "Step 2: Display application name"

  - script: echo "Environment is - $(environmentname)"
    displayName: "Step 3: Display Environment Name"

  - script: echo "Build configuration is - $(buildConfiguration)"
    displayName: "Step 4: Display build configuration"

  - script: echo "Build ID is - $(Build.BuildId)"
    displayName: "Step 5: Build ID"

  - script: echo "Build Number is - $(Build.BuildNumber)"
    displayName: "Step 6: Build Number"

  - script: echo "Source Directory is - $(Build.SourcesDirectory)"
    displayName: "Step 7: Source Directory"